<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="title desc">
  <title id="title">Vertical double-sided cat reaching for mouse paper craft template</title>
  <desc id="desc">A4 printable double-sided paper craft template. Left panel is the front; right panel is a mirrored copy. Cut the cream outer contour after folding and gluing.</desc>
  <defs>
    <style>
      .page { fill: #fff; }
      .panel { fill: none; stroke: #f00; stroke-width: 0.28; }
      .headline { font: 700 4.6px Arial, sans-serif; fill: #111; }
      .label { font: 3px Arial, sans-serif; fill: #111; }
      .tiny { font: 2.25px Arial, sans-serif; fill: #333; }
      .backing { fill: #fff1ca; stroke: #111; stroke-width: 1.1; stroke-linejoin: round; stroke-linecap: round; }
      .cat { fill: #587188; stroke: #111; stroke-width: 0.32; stroke-linejoin: round; stroke-linecap: round; }
      .cat-dark { fill: #405a70; stroke: #111; stroke-width: 0.22; stroke-linejoin: round; stroke-linecap: round; }
      .cat-light { fill: #f6f1e8; stroke: #111; stroke-width: 0.22; stroke-linejoin: round; stroke-linecap: round; }
      .cat-ear { fill: #f39aa8; stroke: #111; stroke-width: 0.2; stroke-linejoin: round; }
      .cat-eye { fill: #f5e25d; stroke: #111; stroke-width: 0.2; }
      .glove { fill: #fff; stroke: #111; stroke-width: 0.28; stroke-linejoin: round; stroke-linecap: round; }
      .mouse { fill: #a35f2f; stroke: #111; stroke-width: 0.28; stroke-linejoin: round; stroke-linecap: round; }
      .mouse-light { fill: #f0bd82; stroke: #111; stroke-width: 0.2; stroke-linejoin: round; stroke-linecap: round; }
      .mouse-ear { fill: #efaf88; stroke: #111; stroke-width: 0.2; }
      .line { fill: none; stroke: #111; stroke-width: 0.2; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #111; stroke-width: 0.15; stroke-linecap: round; }
      .motion { fill: none; stroke: #666; stroke-width: 0.3; stroke-linecap: round; stroke-dasharray: 2 1.2; }
      .optional { fill: none; stroke: #d22; stroke-width: 0.38; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1.5 1.1; }
      .fold { fill: none; stroke: #2368c9; stroke-width: 0.5; stroke-dasharray: 3 2; }
      .glue { fill: #d9d9d9; stroke: #777; stroke-width: 0.25; stroke-dasharray: 1.3 1.1; opacity: 0.78; }
      .mark { fill: none; stroke: #111; stroke-width: 0.24; }
    </style>

    <g id="registration-mark">
      <circle class="mark" cx="0" cy="0" r="2"/>
      <path class="mark" d="M-3 0H3M0 -3V3"/>
    </g>

    <g id="reaching-scene">
      <!-- Tight cream backing: this is the final cutting contour. -->
      <path class="backing" d="
        M56 8
        C70 3 83 10 85 24
        C98 24 107 36 101 49
        C112 61 106 77 92 79
        C90 92 82 104 70 111
        C75 122 73 135 64 143
        C72 151 69 165 58 170
        C60 183 49 194 35 190
        C26 187 22 179 23 170
        C9 166 5 151 15 141
        C6 132 7 118 19 111
        C13 101 16 89 28 84
        C20 74 23 60 34 55
        C31 44 36 34 47 30
        C44 21 47 12 56 8
        Z"/>

      <!-- Jerry above, dodging. -->
      <ellipse class="mouse" cx="70" cy="32" rx="11" ry="16" transform="rotate(25 70 32)"/>
      <ellipse class="mouse-light" cx="70" cy="35" rx="5.5" ry="9" transform="rotate(25 70 35)"/>
      <circle class="mouse" cx="58" cy="23" r="10.8"/>
      <circle class="mouse-ear" cx="50" cy="15" r="5.8"/>
      <circle class="mouse-ear" cx="66" cy="15" r="5.4"/>
      <ellipse class="mouse-light" cx="57" cy="27" rx="6.4" ry="5.4"/>
      <ellipse cx="54" cy="21.5" rx="1.2" ry="1.9" fill="#111"/>
      <ellipse cx="61" cy="21.5" rx="1.2" ry="1.9" fill="#111"/>
      <path d="M55.8 28C57.5 27 59.7 27.1 61 28.2C59.8 30.2 57.1 30.1 55.8 28Z" fill="#311913"/>
      <path class="line" d="M57.5 30.2C54 34 49.5 32.5 47.5 29"/>
      <path class="mouse" d="M66 20C72 14 79 14 82 19C80 25 72 27 66 23Z"/>
      <path class="mouse" d="M78 37C86 41 91 39 94 33C88 29 81 31 77 35Z"/>
      <path class="mouse" d="M66 46C63 55 69 61 76 59C78 52 74 47 68 44Z"/>
      <path class="mouse" d="M54 40C46 45 45 53 51 57C58 54 60 47 57 41Z"/>
      <path d="M73 44C63 50 58 62 61 75" fill="none" stroke="#a35f2f" stroke-width="2.1" stroke-linecap="round"/>
      <path class="thin" d="M52 27L44 25M52 29L44 30M62 27L70 25M62 29L70 30"/>

      <!-- Tom lower-left, reaching upward with both arms. -->
      <path class="cat" d="M34 120C27 138 32 166 45 182C56 194 72 188 78 170C84 149 75 122 59 111C49 104 39 108 34 120Z"/>
      <ellipse class="cat-light" cx="61" cy="151" rx="10" ry="28" transform="rotate(-12 61 151)"/>
      <path class="cat" d="M46 112C42 91 47 72 57 53C63 55 67 61 66 69C60 84 55 99 56 115Z"/>
      <path class="glove" d="M54 50C49 43 52 36 59 37C59 30 67 30 68 37C73 34 78 40 74 46C80 49 77 57 69 56C64 56 58 54 54 50Z"/>
      <path class="cat" d="M69 118C75 98 84 82 96 68C102 71 105 78 102 85C90 97 81 111 78 128Z"/>
      <path class="glove" d="M96 66C95 58 101 54 106 58C110 51 118 55 116 62C123 62 126 70 120 74C124 80 117 85 110 81C104 77 99 72 96 66Z"/>
      <path class="cat-dark" d="M35 168C27 177 29 187 39 190C48 185 49 174 42 166Z"/>
      <path class="cat-dark" d="M65 169C75 175 77 186 69 191C58 188 57 177 62 167Z"/>
      <path class="cat" d="M30 155C19 159 15 170 20 179" fill="none" stroke="#587188" stroke-width="2.4"/>

      <!-- Tom face. -->
      <path class="cat" d="M31 104C20 96 15 82 19 68L41 84Z"/>
      <path class="cat-ear" d="M27 84C24 78 24 73 26 69L36 86Z"/>
      <path class="cat" d="M64 94C70 80 72 66 66 55L54 80Z"/>
      <path class="cat-ear" d="M62 75C64 68 64 63 62 59L56 79Z"/>
      <ellipse class="cat" cx="42" cy="99" rx="27" ry="25" transform="rotate(18 42 99)"/>
      <ellipse class="cat-light" cx="37" cy="108" rx="8.8" ry="9.6" transform="rotate(18 37 108)"/>
      <ellipse class="cat-light" cx="52" cy="112" rx="8.8" ry="9.6" transform="rotate(18 52 112)"/>
      <ellipse class="cat-eye" cx="39" cy="96" rx="5" ry="6.8" transform="rotate(18 39 96)"/>
      <ellipse class="cat-eye" cx="52" cy="100" rx="5" ry="6.8" transform="rotate(18 52 100)"/>
      <ellipse cx="41" cy="97" rx="1.5" ry="2.8" fill="#111"/>
      <ellipse cx="54" cy="101" rx="1.5" ry="2.8" fill="#111"/>
      <ellipse cx="44" cy="110" rx="3" ry="2.1" fill="#111" stroke="#111" stroke-width="0.2"/>
      <path class="line" d="M44 112V116"/>
      <path class="line" d="M44 116C39 120 32 118 30 113"/>
      <path class="line" d="M44 116C49 123 58 122 62 117"/>
      <path class="line" d="M29 91C34 87 40 88 43 93M47 93C53 91 58 94 60 99"/>
      <path class="thin" d="M36 109L23 103M36 112L22 111M36 115L24 120"/>
      <path class="thin" d="M53 114L67 112M53 117L68 119M52 120L65 126"/>

      <path class="motion" d="M36 54C31 47 30 40 34 34"/>
      <path class="motion" d="M84 70C92 62 95 53 92 44"/>
      <path class="motion" d="M23 142C16 135 15 127 19 120"/>
      <path class="motion" d="M48 176C54 184 63 187 73 184"/>
      <path class="optional" d="M32 131C43 138 58 137 68 128"/>
      <path class="optional" d="M48 38C55 42 66 41 73 34"/>

      <use href="#registration-mark" x="54" y="10"/>
      <use href="#registration-mark" x="31" y="187"/>
    </g>
  </defs>

  <rect class="page" x="0" y="0" width="210" height="297"/>
  <text class="headline" x="105" y="15" text-anchor="middle">Vertical double-sided paper craft: cat reaches up, mouse dodges</text>
  <text class="tiny" x="105" y="22" text-anchor="middle">Left is front. Right is mirrored. Cut only the outer cream contour after folding and gluing.</text>

  <line class="fold" x1="105" y1="31" x2="105" y2="268"/>
  <rect class="glue" x="101.7" y="35" width="6.6" height="226" rx="1.2"/>
  <text class="label" x="105" y="276" text-anchor="middle">Fold line and glue strip</text>

  <rect class="panel" x="8" y="30" width="89" height="222"/>
  <rect class="panel" x="113" y="30" width="89" height="222"/>
  <text class="label" x="52.5" y="37" text-anchor="middle">Front</text>
  <text class="label" x="157.5" y="37" text-anchor="middle">Back mirror</text>
  <use href="#reaching-scene" transform="translate(13 39) scale(1.08)"/>
  <use href="#reaching-scene" transform="translate(210 0) scale(-1 1) translate(13 39) scale(1.08)"/>

  <g transform="translate(18 258)">
    <line x1="0" y1="0" x2="13" y2="0" stroke="#111" stroke-width="1.1"/>
    <text class="tiny" x="16" y="0.9">Thick black contour: final cut</text>
    <line x1="0" y1="8" x2="13" y2="8" stroke="#d22" stroke-width="0.38" stroke-dasharray="1.5 1.1"/>
    <text class="tiny" x="16" y="8.9">Red dashed: optional small cuts</text>
    <line x1="0" y1="16" x2="13" y2="16" stroke="#2368c9" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text class="tiny" x="16" y="16.9">Blue dashed: fold</text>
  </g>
</svg>
