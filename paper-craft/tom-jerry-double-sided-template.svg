<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="title desc">
  <title id="title">Double-sided cuttable chase paper craft</title>
  <desc id="desc">A4 printable double-sided paper craft template. A gray cat lunges toward a brown mouse running ahead. Cut the tight cream outside contour after folding and gluing.</desc>
  <defs>
    <style>
      .page { fill: #fff; }
      .headline { font: 700 5px Arial, sans-serif; fill: #111; }
      .label { font: 3px Arial, sans-serif; fill: #111; }
      .tiny { font: 2.35px Arial, sans-serif; fill: #333; }
      .backing { fill: #fff0c2; stroke: #111; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; }
      .cat { fill: #7f98a7; stroke: #111; stroke-width: 0.32; stroke-linejoin: round; stroke-linecap: round; }
      .cat-dark { fill: #6c8796; stroke: #111; stroke-width: 0.25; stroke-linejoin: round; stroke-linecap: round; }
      .cat-light { fill: #fff7ec; stroke: #111; stroke-width: 0.22; stroke-linejoin: round; stroke-linecap: round; }
      .cat-ear { fill: #ee9cac; stroke: #111; stroke-width: 0.2; stroke-linejoin: round; }
      .cat-eye { fill: #ffe36b; stroke: #111; stroke-width: 0.2; }
      .mouse { fill: #a86434; stroke: #111; stroke-width: 0.28; stroke-linejoin: round; stroke-linecap: round; }
      .mouse-light { fill: #f3c184; stroke: #111; stroke-width: 0.2; stroke-linejoin: round; stroke-linecap: round; }
      .mouse-ear { fill: #efb187; stroke: #111; stroke-width: 0.2; }
      .line { fill: none; stroke: #111; stroke-width: 0.22; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #111; stroke-width: 0.16; stroke-linecap: round; }
      .motion { fill: none; stroke: #5a7fa6; stroke-width: 0.35; stroke-linecap: round; stroke-dasharray: 1.2 0.9; }
      .optional { fill: none; stroke: #c9352c; stroke-width: 0.42; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1.6 1.1; }
      .fold { fill: none; stroke: #2368c9; stroke-width: 0.5; stroke-dasharray: 3 2; }
      .glue { fill: #d9d9d9; stroke: #777; stroke-width: 0.25; stroke-dasharray: 1.3 1.1; opacity: 0.78; }
      .mark { fill: none; stroke: #111; stroke-width: 0.26; }
    </style>

    <g id="registration-mark">
      <circle class="mark" cx="0" cy="0" r="2.1"/>
      <path class="mark" d="M-3 0H3M0 -3V3"/>
    </g>

    <g id="chase-cutout">
      <!-- Tight single-piece contour: this is the final cutting line. -->
      <path class="backing" d="
        M19 55
        C26 36 51 30 66 44
        L75 35
        C82 50 81 64 73 78
        C84 83 91 92 93 104
        C101 101 111 102 119 106
        C122 95 137 92 145 101
        C155 96 166 104 164 116
        C176 123 174 140 160 144
        C160 155 148 164 136 159
        C128 169 112 166 107 154
        C100 155 93 153 88 149
        C83 165 68 181 49 183
        C31 185 18 173 19 156
        C8 152 7 138 17 132
        C13 119 15 106 24 96
        C19 87 18 76 23 67
        Z"/>

      <!-- Tom: side-leaning cat, chasing to the right. -->
      <path class="cat-dark" d="M25 132C15 132 10 144 18 151C26 158 36 153 37 143C34 136 30 132 25 132Z"/>
      <path class="cat" d="M39 127C31 142 32 164 44 174C55 184 70 176 76 158C82 139 76 116 63 107C52 99 43 114 39 127Z"/>
      <ellipse class="cat-light" cx="55" cy="143" rx="12" ry="24" transform="rotate(-14 55 143)"/>
      <path class="cat" d="M67 119C79 107 94 104 103 112C99 124 83 131 67 127Z"/>
      <ellipse class="cat-light" cx="101" cy="112" rx="5.0" ry="4.2" transform="rotate(18 101 112)"/>
      <path class="cat" d="M36 121C26 116 16 119 13 126C18 133 31 134 43 126Z"/>
      <path class="cat-light" d="M18 125C22 121 29 121 35 124C30 130 22 130 18 125Z"/>
      <path class="cat" d="M34 161C27 168 29 177 36 177C43 177 46 169 40 163Z"/>
      <path class="cat" d="M66 160C75 168 84 168 88 160C84 154 73 153 65 157Z"/>
      <path class="cat" d="M29 154C20 158 16 166 18 174" fill="none" stroke="#7f98a7" stroke-width="2.5"/>

      <!-- Tom head: recognizable ears, yellow eyes, white muzzle, centered black nose. -->
      <path class="cat" d="M31 77C22 67 20 52 26 40L43 60Z"/>
      <path class="cat-ear" d="M29 58C28 52 29 48 31 44L38 61Z"/>
      <path class="cat" d="M66 77C73 66 75 52 72 41L56 60Z"/>
      <path class="cat-ear" d="M65 58C68 52 69 48 68 44L61 61Z"/>
      <ellipse class="cat" cx="49" cy="83" rx="27" ry="24"/>
      <ellipse class="cat-light" cx="41" cy="94" rx="8.8" ry="9.6"/>
      <ellipse class="cat-light" cx="57" cy="94" rx="8.8" ry="9.6"/>
      <ellipse class="cat-eye" cx="43" cy="82" rx="5.0" ry="6.8"/>
      <ellipse class="cat-eye" cx="57" cy="82" rx="5.0" ry="6.8"/>
      <ellipse cx="45.5" cy="82.8" rx="1.5" ry="2.8" fill="#111"/>
      <ellipse cx="59.4" cy="82.8" rx="1.5" ry="2.8" fill="#111"/>
      <ellipse cx="50" cy="93.2" rx="3.0" ry="2.1" fill="#111" stroke="#111" stroke-width="0.2"/>
      <path class="line" d="M50 95.4V98.8"/>
      <path class="line" d="M50 98.8C45 104 37 103 34 99"/>
      <path class="line" d="M50 98.8C55 104 64 102 67 98"/>
      <path class="line" d="M36 75C40 72 45 72 48 75M52 75C56 72 62 73 65 76"/>
      <path class="thin" d="M41 93L28 90M41 96L27 96M41 99L29 103"/>
      <path class="thin" d="M58 93L72 90M58 96L73 96M58 99L72 103"/>

      <!-- Jerry: ahead of Tom, running right while looking back. -->
      <ellipse class="mouse" cx="126" cy="137" rx="13" ry="18" transform="rotate(-20 126 137)"/>
      <ellipse class="mouse-light" cx="127" cy="140" rx="6.5" ry="10.2" transform="rotate(-20 127 140)"/>
      <circle class="mouse" cx="119" cy="113" r="12.2"/>
      <circle class="mouse-ear" cx="110" cy="105" r="6.5"/>
      <circle class="mouse-ear" cx="129" cy="105" r="6.1"/>
      <ellipse class="mouse-light" cx="118" cy="117" rx="7.5" ry="6.1"/>
      <ellipse cx="114.3" cy="111.5" rx="1.35" ry="2.1" fill="#111"/>
      <ellipse cx="121.8" cy="111.5" rx="1.35" ry="2.1" fill="#111"/>
      <path d="M115.7 119C117.6 117.9 120.1 118.0 121.6 119.3C120.2 121.6 117.2 121.4 115.7 119Z" fill="#311913"/>
      <path class="line" d="M118 121.6C115 125 110 125 107 122.4"/>
      <path class="mouse" d="M118 139C108 137 101 141 100 148C108 151 116 147 121 141Z"/>
      <path class="mouse" d="M132 141C140 144 147 141 149 134C142 132 135 134 131 139Z"/>
      <path class="mouse" d="M120 151C116 159 119 166 126 167C131 162 129 155 124 150Z"/>
      <path class="mouse" d="M135 151C142 157 150 155 153 149C149 144 140 145 134 149Z"/>
      <path d="M138 137C153 132 158 121 151 113" fill="none" stroke="#a86434" stroke-width="2.3" stroke-linecap="round"/>
      <path class="line" d="M112 106C116 103 123 103 127 106"/>
      <path class="thin" d="M113 119L104 117M113 121L104 122M123 119L132 117M123 121L132 122"/>

      <!-- Printed motion marks and a few optional cuts. -->
      <path class="motion" d="M21 111C15 106 14 100 17 95"/>
      <path class="motion" d="M80 100C91 95 101 96 110 101"/>
      <path class="motion" d="M86 151C78 154 70 153 64 149"/>
      <path class="motion" d="M140 129C146 125 149 120 151 114"/>
      <path class="optional" d="M35 111C44 116 56 116 65 110"/>
      <path class="optional" d="M112 129C118 133 127 131 132 126"/>

      <use href="#registration-mark" x="24" y="44"/>
      <use href="#registration-mark" x="151" y="149"/>
    </g>
  </defs>

  <rect class="page" x="0" y="0" width="210" height="297"/>
  <text class="headline" x="105" y="15" text-anchor="middle">Cuttable double-sided paper craft: cat chasing mouse</text>
  <text class="tiny" x="105" y="22" text-anchor="middle">Cut the tight cream outside contour after folding and gluing. Red dashed marks are optional.</text>

  <line class="fold" x1="105" y1="31" x2="105" y2="268"/>
  <rect class="glue" x="101.7" y="35" width="6.6" height="226" rx="1.2"/>
  <text class="label" x="105" y="276" text-anchor="middle">Fold line and glue strip</text>

  <text class="label" x="54" y="37" text-anchor="middle">Front</text>
  <text class="label" x="156" y="37" text-anchor="middle">Back mirror</text>
  <use href="#chase-cutout" transform="translate(0 45) scale(0.64)"/>
  <use href="#chase-cutout" transform="translate(210 0) scale(-1 1) translate(0 45) scale(0.64)"/>

  <g transform="translate(18 258)">
    <line x1="0" y1="0" x2="13" y2="0" stroke="#111" stroke-width="1.2"/>
    <text class="tiny" x="16" y="0.9">Thick black contour: final cut</text>
    <line x1="0" y1="8" x2="13" y2="8" stroke="#c9352c" stroke-width="0.42" stroke-dasharray="1.6 1.1"/>
    <text class="tiny" x="16" y="8.9">Red dashed: optional small cuts</text>
    <line x1="0" y1="16" x2="13" y2="16" stroke="#2368c9" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text class="tiny" x="16" y="16.9">Blue dashed: score and fold</text>
  </g>

  <g transform="translate(122 256)">
    <text class="tiny" x="0" y="0">Cuttable design:</text>
    <text class="tiny" x="0" y="6">1. Print colors first.</text>
    <text class="tiny" x="0" y="12">2. Fold, glue, align marks.</text>
    <text class="tiny" x="0" y="18">3. Cut only the outside edge.</text>
  </g>
</svg>
