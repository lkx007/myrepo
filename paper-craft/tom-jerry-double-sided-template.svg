<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="title desc">
  <title id="title">Tom and Jerry inspired double-sided paper-cut template</title>
  <desc id="desc">A4 printable paper-cut template with mirrored front and back panels, cut lines, fold line, glue area, and optional inner details.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 5.2px sans-serif; fill: #111111; }
      .label { font: 3.2px sans-serif; fill: #111111; }
      .tiny { font: 2.4px sans-serif; fill: #333333; }
      .cut { fill: #fff8df; stroke: #111111; stroke-width: 0.85; stroke-linejoin: round; stroke-linecap: round; }
      .inner-cut { fill: none; stroke: #c5352a; stroke-width: 0.45; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1.7 1.1; }
      .draw { fill: none; stroke: #222222; stroke-width: 0.38; stroke-linejoin: round; stroke-linecap: round; }
      .soft { fill: none; stroke: #666666; stroke-width: 0.28; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1.2 0.9; }
      .fold { fill: none; stroke: #2468c9; stroke-width: 0.5; stroke-dasharray: 3 2; }
      .glue { fill: #d8d8d8; stroke: #777777; stroke-width: 0.25; stroke-dasharray: 1.3 1.1; opacity: 0.75; }
      .mark { fill: none; stroke: #111111; stroke-width: 0.28; }
      .legend-cut { stroke: #111111; stroke-width: 0.9; }
      .legend-inner { stroke: #c5352a; stroke-width: 0.5; stroke-dasharray: 1.7 1.1; }
      .legend-fold { stroke: #2468c9; stroke-width: 0.5; stroke-dasharray: 3 2; }
    </style>

    <g id="registration-mark">
      <circle class="mark" cx="0" cy="0" r="2.2"/>
      <path class="mark" d="M-3 0H3M0 -3V3"/>
    </g>

    <g id="tom-jerry-figure">
      <!-- One continuous outside silhouette keeps the final ornament sturdy. -->
      <path class="cut" d="
        M48.5 52.8
        C40.7 55.3 35.1 62.6 32.9 74.9
        L22.6 66.2
        L25.3 90.1
        C17.6 98.5 14.5 114.8 19.1 131.5
        C9.1 138.4 10.7 153.5 22.4 158.4
        C25.2 176.4 39.0 190.7 55.8 193.6
        C70.4 196.1 82.5 188.1 86.1 176.3
        C89.4 179.2 94.3 179.6 98.2 177.2
        C96.5 172.6 98.7 167.3 103.2 164.9
        C108.6 162.1 114.9 165.1 116.0 171.0
        C121.6 171.8 124.9 177.8 122.7 183.0
        C120.1 189.2 111.9 190.8 106.8 186.4
        C99.9 191.9 88.1 189.1 83.4 179.7
        C78.7 187.0 70.5 192.2 61.3 193.2
        C69.4 201.7 83.7 201.0 91.5 192.4
        C103.7 203.7 126.7 196.4 130.4 179.4
        C133.9 163.4 120.8 149.0 104.8 151.8
        C105.2 141.5 103.5 129.7 99.0 117.8
        C108.7 110.8 111.1 98.0 104.0 89.6
        C98.5 83.1 89.2 81.2 80.1 84.5
        C75.5 68.0 63.4 50.9 48.5 52.8
        Z"/>

      <!-- Optional inner cuts: use a craft knife first if you want openwork. -->
      <circle class="inner-cut" cx="50.2" cy="57.8" r="2.9"/>
      <path class="inner-cut" d="M41.9 85.0C45.4 81.5 51.8 81.1 55.6 84.2"/>
      <path class="inner-cut" d="M63.8 84.7C67.0 81.5 72.7 81.8 75.8 85.4"/>
      <ellipse class="inner-cut" cx="50.7" cy="95.0" rx="3.0" ry="4.2"/>
      <ellipse class="inner-cut" cx="69.4" cy="94.7" rx="3.0" ry="4.2"/>
      <path class="inner-cut" d="M58.8 103.1C62.1 101.0 66.0 101.0 69.2 103.2C66.7 106.3 61.4 106.2 58.8 103.1Z"/>
      <path class="inner-cut" d="M61.3 108.4C57.5 113.2 49.9 113.8 45.6 109.7"/>
      <path class="inner-cut" d="M66.7 108.3C70.7 113.0 78.5 113.2 82.7 108.7"/>
      <path class="inner-cut" d="M35.1 116.6C44.1 126.6 56.2 128.9 68.3 121.4"/>
      <path class="inner-cut" d="M77.2 125.0C83.9 132.1 86.1 142.1 82.7 152.3"/>
      <path class="inner-cut" d="M100.6 171.8C103.8 168.3 110.0 168.7 112.5 172.4"/>
      <circle class="inner-cut" cx="108.3" cy="174.8" r="1.6"/>
      <path class="inner-cut" d="M105.1 181.0C109.3 183.6 114.2 182.6 117.0 179.0"/>

      <!-- Drawn guidance that can be traced with a pen after cutting. -->
      <path class="draw" d="M47.2 99.1L36.7 96.4M47.6 102.3L35.1 102.5M47.2 105.4L36.0 109.0"/>
      <path class="draw" d="M72.2 99.2L84.1 96.2M72.5 102.4L86.0 102.8M72.0 105.3L84.9 109.4"/>
      <path class="draw" d="M39.8 132.9C50.2 146.7 68.4 143.6 72.9 129.0"/>
      <path class="draw" d="M89.7 160.2C94.7 154.3 102.9 151.7 110.2 154.5"/>
      <path class="soft" d="M35.8 74.9C41.3 74.4 45.0 77.0 47.7 81.1"/>
      <path class="soft" d="M74.1 85.0C76.2 80.2 79.8 77.3 85.5 76.5"/>
      <path class="soft" d="M103.4 164.9C106.1 158.9 113.1 156.8 119.8 160.6"/>

      <!-- Small alignment crosses help check the two printed sides before gluing. -->
      <use href="#registration-mark" x="28" y="46"/>
      <use href="#registration-mark" x="126" y="204"/>
    </g>
  </defs>

  <rect class="page" x="0" y="0" width="210" height="297"/>

  <text class="title" x="105" y="15" text-anchor="middle">Double-sided paper-cut: Tom and Jerry chase</text>
  <text class="tiny" x="105" y="22" text-anchor="middle">Print A4 at 100%. Blue dashed line = fold. Gray strip = glue. Black outline = cut. Red dashed details = optional cutouts.</text>

  <line class="fold" x1="105" y1="31" x2="105" y2="268"/>
  <rect class="glue" x="101.7" y="35" width="6.6" height="226" rx="1.2"/>
  <text class="label" x="105" y="276" text-anchor="middle">Fold here, printed sides out</text>

  <text class="label" x="54" y="37" text-anchor="middle">Front</text>
  <text class="label" x="156" y="37" text-anchor="middle">Back mirror</text>
  <use href="#tom-jerry-figure"/>
  <use href="#tom-jerry-figure" transform="translate(210 0) scale(-1 1)"/>

  <g transform="translate(18 258)">
    <line class="legend-cut" x1="0" y1="0" x2="13" y2="0"/>
    <text class="tiny" x="16" y="0.9">Black solid: final outside cut</text>
    <line class="legend-inner" x1="0" y1="8" x2="13" y2="8"/>
    <text class="tiny" x="16" y="8.9">Red dashed: optional inner cutouts</text>
    <line class="legend-fold" x1="0" y1="16" x2="13" y2="16"/>
    <text class="tiny" x="16" y="16.9">Blue dashed: score and fold</text>
  </g>

  <g transform="translate(122 256)">
    <text class="tiny" x="0" y="0">Tips:</text>
    <text class="tiny" x="0" y="6">1. Cut red details before folding.</text>
    <text class="tiny" x="0" y="12">2. Align the two round marks, then glue.</text>
    <text class="tiny" x="0" y="18">3. Cut black outline last; go slowly around ears and tails.</text>
  </g>
</svg>
