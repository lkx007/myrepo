<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>竖版双面猫鼠剪纸模板</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f0f0f0; color: #222; font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; }
    .toolbar { max-width: 980px; margin: 18px auto 12px; padding: 16px 20px; background: #fff; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .toolbar h1 { margin: 0 0 10px; font-size: 21px; }
    .toolbar p { margin: 6px 0; line-height: 1.55; }
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
    .steps li { padding: 8px 10px; border: 1px solid #e1e1e1; border-radius: 8px; background: #fafafa; line-height: 1.45; }
    button { margin-top: 12px; padding: 8px 14px; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; cursor: pointer; font-size: 14px; }
    .note { color: #666; font-size: 13px; }
    .sheet { width: 210mm; min-height: 297mm; margin: 0 auto 24px; background: #fff; box-shadow: 0 3px 16px rgba(0,0,0,.18); }
    .sheet svg { display: block; width: 210mm; height: 297mm; }
    @media print { body { background: #fff; } .toolbar { display: none; } .sheet { margin: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <main>
    <section class="toolbar" aria-label="中文打印说明">
      <h1>竖版双面猫鼠剪纸模板</h1>
      <p>你说得对，猫应该竖着排。新版改成竖版：猫用高度表达头、身体、脚，老鼠放在脚边，这样半张 A4 的宽度不会被横向挤爆。</p>
      <p>做法：左边正面、右边镜像背面；沿蓝色虚线对折，在灰色区涂胶，对齐定位点后，只剪米黄色外轮廓粗黑线。</p>
      <ul class="steps">
        <li><strong>打印：</strong>选择 A4、100% 或“实际大小”。</li>
        <li><strong>对折：</strong>沿蓝色虚线压痕，让印刷面朝外。</li>
        <li><strong>涂胶：</strong>灰色区域薄涂胶，对齐圆形定位标记。</li>
        <li><strong>剪切：</strong>只剪最外侧粗黑线，红色虚线可不刻。</li>
        <li><strong>成品：</strong>猫是竖向主体，老鼠在脚边形成追逐关系。</li>
      </ul>
      <button type="button" onclick="window.print()">打印模板</button>
      <p class="note">这是可剪纸艺模板，角色细节靠彩色打印保留，外轮廓保持一整块连续结构。</p>
    </section>

    <section class="sheet" aria-label="A4 竖版双面剪纸模板">

            .tiny { font: 2.35px Arial, sans-serif; fill: #333; }
            .backing { fill: #fff0c2; stroke: #111; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; }
            .cat { fill: #7f98a7; stroke: #111; stroke-width: 0.32; stroke-linejoin: round; stroke-linecap: round; }
            .cat-dark { fill: #6d8794; stroke: #111; stroke-width: 0.24; stroke-linejoin: round; stroke-linecap: round; }
            .cat-light { fill: #fff7ec; stroke: #111; stroke-width: 0.22; stroke-linejoin: round; stroke-linecap: round; }
            .cat-ear { fill: #ee9cac; stroke: #111; stroke-width: 0.2; stroke-linejoin: round; }
            .cat-eye { fill: #ffe36b; stroke: #111; stroke-width: 0.2; }
            .mouse { fill: #a86434; stroke: #111; stroke-width: 0.28; stroke-linejoin: round; stroke-linecap: round; }
            .mouse-light { fill: #f3c184; stroke: #111; stroke-width: 0.2; stroke-linejoin: round; stroke-linecap: round; }
            .mouse-ear { fill: #efb187; stroke: #111; stroke-width: 0.2; }
            .line { fill: none; stroke: #111; stroke-width: 0.22; stroke-linecap: round; stroke-linejoin: round; }
            .thin { fill: none; stroke: #111; stroke-width: 0.16; stroke-linecap: round; }
            .motion { fill: none; stroke: #5a7fa6; stroke-width: 0.35; stroke-linecap: round; stroke-dasharray: 1.2 0.9; }
            .optional { fill: none; stroke: #c9352c; stroke-width: 0.42; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1.6 1.1; }
            .fold { fill: none; stroke: #2368c9; stroke-width: 0.5; stroke-dasharray: 3 2; }
            .glue { fill: #d9d9d9; stroke: #777; stroke-width: 0.25; stroke-dasharray: 1.3 1.1; opacity: 0.78; }
            .mark { fill: none; stroke: #111; stroke-width: 0.26; }
          </style>

        </defs>

        <rect class="page" x="0" y="0" width="210" height="297"/>
        <text class="headline" x="105" y="15" text-anchor="middle">Vertical double-sided paper craft: cat above, mouse below</text>
        <text class="tiny" x="105" y="22" text-anchor="middle">Cut the outside contour after folding and gluing. Red dashed marks are optional.</text>

        <line class="fold" x1="105" y1="31" x2="105" y2="268"/>
        <rect class="glue" x="101.7" y="35" width="6.6" height="226" rx="1.2"/>
        <text class="label" x="105" y="276" text-anchor="middle">Fold line and glue strip</text>

        <text class="label" x="54" y="37" text-anchor="middle">Front</text>
        <text class="label" x="156" y="37" text-anchor="middle">Back mirror</text>
        <use href="#vertical-chase" transform="translate(8 45) scale(0.82)"/>
        <use href="#vertical-chase" transform="translate(210 0) scale(-1 1) translate(8 45) scale(0.82)"/>

        <g transform="translate(18 258)">
          <line x1="0" y1="0" x2="13" y2="0" stroke="#111" stroke-width="1.2"/>
          <text class="tiny" x="16" y="0.9">Thick black contour: final cut</text>
          <line x1="0" y1="8" x2="13" y2="8" stroke="#c9352c" stroke-width="0.42" stroke-dasharray="1.6 1.1"/>
          <text class="tiny" x="16" y="8.9">Red dashed: optional small cuts</text>
          <line x1="0" y1="16" x2="13" y2="16" stroke="#2368c9" stroke-width="0.5" stroke-dasharray="3 2"/>
          <text class="tiny" x="16" y="16.9">Blue dashed: score and fold</text>
        </g>

        <g transform="translate(122 256)">
          <text class="tiny" x="0" y="0">Vertical layout:</text>
          <text class="tiny" x="0" y="6">1. Cat uses height, not width.</text>
          <text class="tiny" x="0" y="12">2. Mouse stays by the feet.</text>
          <text class="tiny" x="0" y="18">3. Cut one continuous edge.</text>
        </g>
      </svg>
    </section>
  </main>
</body>
</html>
